      }
    }

</head>

<body>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      var errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.width = '100vw';
      errDiv.style.height = '100vh';
      errDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.9)';
      errDiv.style.color = 'white';
      errDiv.style.zIndex = '999999';
      errDiv.style.padding = '20px';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '16px';
      errDiv.style.whiteSpace = 'pre-wrap';
      errDiv.innerHTML = '<h1>FATAL BROWSER CRASH</h1>' +
        '<p>Message: ' + message + '</p>' +
        '<p>Source: ' + source + ':' + lineno + ':' + colno + '</p>' +
        '<p>Stack:<br/>' + (error ? error.stack : 'N/A') + '</p>';
      document.body.appendChild(errDiv);
    };
    window.addEventListener('unhandledrejection', function (event) {
      var errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.width = '100vw';
      errDiv.style.height = '100vh';
      errDiv.style.backgroundColor = 'rgba(200, 0, 0, 0.9)';
      errDiv.style.color = 'white';
      errDiv.style.zIndex = '999999';
      errDiv.style.padding = '20px';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '16px';
      errDiv.style.whiteSpace = 'pre-wrap';
      errDiv.innerHTML = '<h1>UNHANDLED PROMISE REJECTION</h1>' +
        '<p>Reason:<br/>' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</p>';
      document.body.appendChild(errDiv);
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
